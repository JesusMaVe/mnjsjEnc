services:
  postgres:
    image: postgres:16-alpine
    container_name: securemessage-db
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
      - ./backend/migrations/002_remove_plaintext.sql:/docker-entrypoint-initdb.d/002_remove_plaintext.sql
      - ./docker/postgres-certs/server.crt:/var/lib/postgresql/server.crt:ro
      - ./docker/postgres-certs/server.key:/var/lib/postgresql/server.key:ro
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

volumes:
  pgdata:
